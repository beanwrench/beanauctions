<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeanAuctions</title>
<style>
  :root {
    --navy:#0c2350; --blue:#1d4ea8; --blue-d:#163d86; --blue-l:#e8eefa; --yellow:#ffc120; --yellow-d:#e8aa00;
    --red:#d32f2f; --red-l:#fdecec; --green:#1e7b3a; --green-l:#e6f4ea; --amber:#8a5a00; --amber-l:#fff4d6;
    --bg:#f2f4f7; --card:#fff; --line:#dfe3ea; --line2:#eceff4; --text:#141a26; --muted:#5b6475; --faint:#8a92a3;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.45 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color:var(--text); background:var(--bg); -webkit-font-smoothing:antialiased; }
  body.ingame { background:rgba(6,9,14,.62); overflow:hidden; user-select:none; }
  .num { font-variant-numeric:tabular-nums; }
  a { color:var(--blue); cursor:pointer; text-decoration:none; } a:hover { text-decoration:underline; }
  button { font:inherit; cursor:pointer; border:0; border-radius:4px; padding:8px 14px; font-weight:600; line-height:1.2; }
  button:disabled { opacity:.45; cursor:default; }
  .btn-y { background:var(--yellow); color:#1b1f29; } .btn-y:hover:not(:disabled) { background:var(--yellow-d); }
  .btn-b { background:var(--blue); color:#fff; } .btn-b:hover:not(:disabled) { background:var(--blue-d); }
  .btn-o { background:#fff; color:var(--blue); box-shadow:inset 0 0 0 1px #b9c6e0; } .btn-o:hover:not(:disabled) { background:var(--blue-l); }
  .btn-g { background:transparent; color:var(--muted); box-shadow:inset 0 0 0 1px var(--line); } .btn-g:hover { background:#fff; color:var(--text); }
  .btn-lg { padding:12px 18px; font-size:15px; }
  input { font:inherit; padding:8px 10px; border:1px solid #c9d0dc; border-radius:4px; background:#fff; color:var(--text); user-select:text; outline:none; }
  input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(29,78,168,.15); }
  svg.i { width:16px; height:16px; vertical-align:-3px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* ---------- tablet (in game only) ---------- */
  #device { height:100%; display:flex; flex-direction:column; }
  body.ingame #device { position:absolute; inset:0; margin:auto; width:min(1760px, 95vw); height:min(1080px, 93vh); background:#17191d; border-radius:38px; padding:20px;
    box-shadow:0 0 0 2px #2b2e34, 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 1px #000; animation:rise .28s ease-out; }
  body.ingame #device::before { content:""; position:absolute; top:8px; left:50%; width:7px; height:7px; margin-left:-3px; border-radius:50%; background:#0b0c0e; box-shadow:inset 0 0 0 1px #2a2d33; }
  @keyframes rise { from { transform:translateY(24px); opacity:0; } }
  #screen { position:relative; flex:1; min-height:0; display:flex; flex-direction:column; background:var(--bg); overflow:hidden; }
  body.ingame #screen { border-radius:20px; }
  #statusbar { display:none; height:26px; flex:none; padding:0 18px; align-items:center; justify-content:space-between; font-size:12px; font-weight:600; color:#fff; background:#0a1a3d; }
  body.ingame #statusbar { display:flex; }
  body.ingame.on-launcher #statusbar { background:transparent; position:absolute; top:0; left:0; right:0; z-index:3; }
  #statusbar .r { display:flex; gap:12px; align-items:center; }
  #statusbar svg.i { width:14px; height:14px; }
  .batt { display:inline-flex; align-items:center; gap:4px; } .batt i { width:22px; height:11px; border:1.5px solid #fff; border-radius:3px; position:relative; display:inline-block; }
  .batt i::before { content:""; position:absolute; left:1px; top:1px; bottom:1px; width:var(--b); background:#fff; border-radius:1px; } .batt i::after { content:""; position:absolute; right:-4px; top:3px; width:2px; height:4px; background:#fff; border-radius:0 1px 1px 0; }
  #power { background:none; color:#fff; padding:0 2px; opacity:.85; } #power:hover { opacity:1; }
  #homebar { display:none; position:absolute; bottom:6px; left:50%; width:150px; margin-left:-75px; height:5px; border-radius:3px; background:rgba(20,26,38,.35); cursor:pointer; z-index:5; }
  #homebar::after { content:""; position:absolute; inset:-10px -20px; }
  body.ingame #homebar { display:block; } body.ingame.on-launcher #homebar { background:rgba(255,255,255,.55); }

  /* ---------- home screen ---------- */
  #launcher { display:none; flex:1; position:relative; color:#fff; overflow:hidden; background:#0b1630; }
  body.on-launcher #launcher { display:block; } body.on-launcher #site, body.on-diag #site { display:none; }
  .wall { position:absolute; inset:-30px; background-size:cover; background-position:center; filter:blur(18px) brightness(.5) saturate(1.15); transform:scale(1.05); }
  .wall-tint { position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,18,44,.25), rgba(8,18,44,.7)); }
  .lk { position:relative; height:100%; padding:56px 64px 150px; display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:40px; }
  .lk-clock { font-size:88px; font-weight:300; letter-spacing:-2px; line-height:1; } .lk-date { font-size:18px; opacity:.85; margin-top:6px; }
  .hero-w { margin-top:34px; width:min(620px, 100%); background:rgba(255,255,255,.1); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.14); border-radius:22px; overflow:hidden; cursor:pointer; transition:transform .15s, background .15s; }
  .hero-w:hover { background:rgba(255,255,255,.14); transform:translateY(-2px); }
  .hero-w .ph { aspect-ratio:16/8; background:rgba(255,255,255,.06); position:relative; } .hero-w .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .hero-w .ph .chip-live, .hero-w .ph .when { position:absolute; left:14px; top:14px; }
  .hero-w .ph .when { background:rgba(10,16,30,.75); padding:4px 10px; border-radius:6px; font-size:12.5px; font-weight:600; }
  .hero-w .tx { padding:14px 18px 16px; display:flex; align-items:flex-end; gap:16px; }
  .hero-w .tx .n { flex:1; min-width:0; } .hero-w .tx .n b { font-size:17px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .hero-w .tx .n span { font-size:13px; opacity:.75; }
  .hero-w .tx .p { text-align:right; } .hero-w .tx .p b { font-size:28px; display:block; letter-spacing:-.5px; line-height:1.1; } .hero-w .tx .p span { font-size:12px; opacity:.8; }
  .hero-w .goingbar { display:flex; gap:4px; padding:0 18px 14px; } .hero-w .goingbar i { flex:1; height:4px; border-radius:2px; background:rgba(255,255,255,.18); transition:background .2s; } .hero-w .goingbar i.on { background:#ff5a5a; }
  .widgets { display:flex; flex-direction:column; gap:14px; }
  .wdg { background:rgba(255,255,255,.1); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.14); border-radius:20px; padding:16px 18px; cursor:pointer; transition:background .15s; }
  .wdg:hover { background:rgba(255,255,255,.15); }
  .wdg h5 { margin:0 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; opacity:.75; font-weight:600; }
  .wdg .big { font-size:30px; font-weight:600; letter-spacing:-.5px; }
  .wdg .row3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; } .wdg .row3 b { display:block; font-size:24px; } .wdg .row3 span { font-size:11px; opacity:.75; }
  .wdg .ticker div { display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:4px 0; border-bottom:1px solid rgba(255,255,255,.08); } .wdg .ticker div:last-child { border:0; }
  .wdg .ticker span:first-child { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; opacity:.9; }
  .wdg .diagline { display:flex; align-items:center; gap:10px; font-size:13px; } .wdg .diagline i { width:9px; height:9px; border-radius:50%; background:#6b7787; flex:none; } .wdg .diagline i.g { background:#4ade80; box-shadow:0 0 8px #4ade80; }
  .dock { position:absolute; left:50%; bottom:26px; transform:translateX(-50%); display:flex; gap:22px; padding:14px 22px 10px; border-radius:28px; background:rgba(255,255,255,.14); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.18); box-shadow:0 10px 30px rgba(0,0,0,.3); }
  .app { text-align:center; cursor:pointer; font-size:11.5px; font-weight:500; position:relative; width:76px; }
  .app .ico { width:64px; height:64px; margin:0 auto 6px; border-radius:16px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(0,0,0,.3); transition:transform .14s cubic-bezier(.3,.7,.4,1.4); }
  .app:hover .ico { transform:translateY(-4px) scale(1.06); } .app:active .ico { transform:scale(.92); transition-duration:.06s; }
  .app .ico svg { width:32px; height:32px; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .app .dotbadge { position:absolute; top:-6px; right:2px; min-width:22px; height:22px; padding:0 6px; border-radius:11px; background:var(--red); color:#fff; font-size:11.5px; font-weight:700; line-height:22px; box-shadow:0 2px 6px rgba(0,0,0,.3); }

  /* app switching, screen on/off */
  .appin { animation:appin .26s cubic-bezier(.2,.8,.2,1); } @keyframes appin { from { transform:scale(.93); opacity:0; } }
  .homein { animation:homein .3s cubic-bezier(.2,.8,.2,1); } @keyframes homein { from { transform:scale(1.06); opacity:.3; } }
  body.ingame #screen::after { content:""; position:absolute; inset:0; background:#000; pointer-events:none; z-index:30; animation:poweron .5s ease-out forwards; }
  @keyframes poweron { 0% { opacity:1; } 30% { opacity:1; } 100% { opacity:0; } }
  body.ingame { transition:background .2s; } body.ingame.closing { background:rgba(6,9,14,0); }
  body.closing #device { animation:sink .2s ease-in forwards; } @keyframes sink { to { transform:translateY(40px); opacity:0; } }

  /* ---------- site chrome ---------- */
  #site { flex:1; min-height:0; display:flex; flex-direction:column; }
  .util { background:var(--navy); color:#b8c4de; font-size:12px; padding:5px 24px; display:flex; gap:18px; align-items:center; }
  .util .sp { flex:1; } .util a { color:#fff; } .util .unit { opacity:.55; color:#fff; } .util .unit.on { opacity:1; font-weight:700; }
  .util .clk2 { background:var(--yellow); color:#1b1f29; font-weight:700; padding:0 6px; border-radius:3px; }
  header.top { background:#fff; border-bottom:1px solid var(--line); padding:12px 24px; display:flex; align-items:center; gap:28px; }
  .logo { display:flex; align-items:center; gap:9px; cursor:pointer; flex:none; }
  .logo .mark { width:34px; height:34px; border-radius:7px; background:var(--yellow); display:flex; align-items:center; justify-content:center; }
  .logo .mark svg { width:22px; height:22px; stroke:var(--navy); stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .logo .wm { font-size:22px; font-weight:800; letter-spacing:-.4px; color:var(--navy); } .logo .wm span { color:var(--blue); font-weight:600; }
  .search { flex:1; display:flex; max-width:640px; }
  .search input { flex:1; border-radius:4px 0 0 4px; border-right:0; padding:10px 12px; }
  .search button { border-radius:0 4px 4px 0; padding:0 18px; }
  .acct { margin-left:auto; text-align:right; font-size:11.5px; color:var(--muted); line-height:1.2; flex:none; } .acct b { display:block; font-size:18px; color:var(--text); }
  nav#nav { background:var(--blue); padding:0 14px; display:flex; align-items:stretch; }
  nav#nav a { color:#dbe5fb; padding:10px 14px; font-weight:600; font-size:13.5px; border-bottom:3px solid transparent; display:flex; align-items:center; gap:6px; text-decoration:none; }
  nav#nav a:hover { color:#fff; background:rgba(255,255,255,.06); } nav#nav a.on { color:#fff; border-bottom-color:var(--yellow); }
  nav#nav .sp { flex:1; } nav#nav .meta { color:#c3d1f0; font-size:12px; display:flex; align-items:center; padding:0 10px; }
  .cnt { background:rgba(255,255,255,.18); color:#fff; border-radius:9px; font-size:11px; padding:0 7px; line-height:18px; }
  .cnt.red { background:var(--red); } .cnt.y { background:var(--yellow); color:#1b1f29; }
  .livedot { width:8px; height:8px; border-radius:50%; background:#ff5a5a; box-shadow:0 0 0 0 rgba(255,90,90,.7); animation:ping 1.6s infinite; }
  @keyframes ping { 70% { box-shadow:0 0 0 7px rgba(255,90,90,0); } 100% { box-shadow:0 0 0 0 rgba(255,90,90,0); } }
  #conn { display:none; background:var(--red); color:#fff; padding:8px 24px; font-weight:600; }
  main#main { flex:1; overflow:auto; scroll-behavior:auto; }
  .wrap { padding:20px 24px 36px; max-width:1500px; margin:0 auto; }
  .crumbs { font-size:12.5px; color:var(--muted); margin-bottom:10px; } .crumbs a { color:var(--muted); } .crumbs b { color:var(--text); font-weight:600; }
  h1.pg { font-size:22px; margin:0 0 4px; letter-spacing:-.3px; } h2.sec { font-size:17px; margin:28px 0 12px; display:flex; align-items:baseline; gap:12px; } h2.sec a { font-size:13px; font-weight:600; margin-left:auto; }
  .muted { color:var(--muted); font-size:12.5px; } .faint { color:var(--faint); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:6px; }
  .pad { padding:16px; }
  .card h3, .block h3 { margin:0; padding:11px 16px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--navy); border-bottom:1px solid var(--line2); background:#fafbfc; border-radius:6px 6px 0 0; }
  .empty { background:#fff; border:1px dashed #c9d0dc; border-radius:6px; padding:48px 20px; text-align:center; color:var(--muted); }
  .empty b { display:block; color:var(--text); font-size:15px; margin-bottom:4px; }

  /* tags */
  .tag { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.03em; padding:2px 6px; border-radius:3px; margin:4px 4px 0 0; white-space:nowrap; }
  .t-salvage { background:var(--red-l); color:#b3261e; } .t-clean { background:var(--green-l); color:var(--green); } .t-seller { background:#edf0f5; color:#3d4659; }
  .t-low { background:var(--amber-l); color:var(--amber); } .t-rd { background:var(--blue-l); color:var(--blue-d); } .t-insp { background:#efe7fb; color:#5b2da0; }
  .t-mine { background:var(--navy); color:#fff; } .t-deal { background:#e3f6ec; color:#0d6b37; }
  .chip-live { display:inline-flex; align-items:center; gap:5px; background:var(--red); color:#fff; font-size:11px; font-weight:700; letter-spacing:.04em; padding:2px 8px; border-radius:3px; }
  .chip-live i { width:6px; height:6px; border-radius:50%; background:#fff; animation:blink 1s infinite; } @keyframes blink { 50% { opacity:.3; } }

  /* lot cards */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:14px; }
  .lc { background:#fff; border:1px solid var(--line); border-radius:6px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column; transition:box-shadow .12s, border-color .12s; }
  .lc:hover { border-color:#b9c6e0; box-shadow:0 4px 14px rgba(16,32,72,.09); }
  .lc .ph { position:relative; aspect-ratio:16/10; background:#dde2ea; }
  .lc .ph img, .ph img, .hero-ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .lc .ov { position:absolute; left:8px; top:8px; } .lc .ov .when { background:rgba(12,20,38,.82); color:#fff; font-size:11.5px; font-weight:600; padding:3px 7px; border-radius:3px; }
  .star { position:absolute; right:8px; top:8px; width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; color:#7a8294; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .star:hover { color:var(--yellow-d); } .star.on { color:var(--yellow-d); } .star.on svg { fill:currentColor; }
  .lc .bd { padding:10px 12px 12px; display:flex; flex-direction:column; flex:1; }
  .lc .nm { font-weight:700; font-size:14px; line-height:1.3; color:var(--blue-d); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:36px; }
  .lc .meta { font-size:12px; color:var(--muted); margin-top:3px; }
  .lc .pr { display:flex; justify-content:space-between; align-items:flex-end; margin-top:auto; padding-top:10px; border-top:1px solid var(--line2); }
  .lc .pr .lab { font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--faint); } .lc .pr b { font-size:18px; display:block; letter-spacing:-.3px; }
  .lc .pr .rt { text-align:right; font-size:12px; color:var(--muted); }
  .lc .tags { min-height:24px; margin-bottom:6px; }
  .win { color:var(--green); } .lose { color:var(--red); }

  /* home page */
  .hero { background:var(--navy); color:#fff; position:relative; overflow:hidden; }
  .hero .bgimg { position:absolute; right:0; top:0; bottom:0; width:58%; background-size:cover; background-position:center; opacity:.42;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 45%); mask-image:linear-gradient(90deg, transparent, #000 45%); }
  .hero .in { position:relative; padding:38px 24px 34px; max-width:1500px; margin:0 auto; }
  .hero h1 { font-size:34px; line-height:1.15; margin:0 0 8px; letter-spacing:-.6px; max-width:620px; font-weight:700; }
  .hero p { margin:0 0 20px; color:#c3d1f0; max-width:560px; font-size:15px; }
  .hero .search { max-width:620px; } .hero .search input { border:0; padding:13px 14px; font-size:15px; }
  .quick { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .quick a { color:#fff; font-size:12.5px; padding:5px 11px; border:1px solid rgba(255,255,255,.28); border-radius:16px; text-decoration:none; } .quick a:hover { background:rgba(255,255,255,.1); }
  .stats { display:flex; gap:0; margin-top:26px; } .stats div { padding-right:28px; margin-right:28px; border-right:1px solid rgba(255,255,255,.18); }
  .stats div:last-child { border:0; } .stats b { display:block; font-size:22px; } .stats span { font-size:12px; color:#b8c4de; }
  .sellers { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .sl { background:#fff; border:1px solid var(--line); border-radius:6px; padding:16px; cursor:pointer; border-top:3px solid var(--c); }
  .sl:hover { box-shadow:0 4px 14px rgba(16,32,72,.08); } .sl b { font-size:15px; } .sl .n { float:right; color:var(--muted); font-size:12.5px; } .sl p { margin:6px 0 0; color:var(--muted); font-size:12.5px; }
  table.tb { width:100%; border-collapse:collapse; background:#fff; }
  .tb th { text-align:left; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); padding:9px 12px; background:#f6f7f9; border-bottom:1px solid var(--line); font-weight:600; position:sticky; top:0; z-index:1; }
  .tb td { padding:10px 12px; border-bottom:1px solid var(--line2); vertical-align:middle; }
  .tb tr.click { cursor:pointer; } .tb tr.click:hover td { background:#f8faff; }
  .tb .th { width:120px; height:75px; object-fit:cover; border-radius:4px; display:block; background:#dde2ea; }
  .ctaband { display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:14px; margin-top:28px; }
  .ctaband .dark { background:var(--navy); color:#fff; border-radius:6px; padding:20px; } .ctaband .dark h3 { margin:0 0 6px; font-size:18px; } .ctaband .dark p { color:#c3d1f0; margin:0 0 14px; }
  footer.ft { border-top:1px solid var(--line); margin-top:36px; padding-top:18px; display:grid; grid-template-columns:1fr 1fr 1.2fr; gap:28px; color:var(--muted); font-size:12.5px; }
  footer.ft h4 { margin:0 0 6px; color:var(--text); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  footer.ft table { border-collapse:collapse; width:100%; } footer.ft td { padding:2px 0; border-bottom:1px dotted var(--line); } footer.ft td:last-child { text-align:right; }

  /* find */
  .find { display:grid; grid-template-columns:230px 1fr; gap:20px; align-items:start; }
  aside.flt { background:#fff; border:1px solid var(--line); border-radius:6px; position:sticky; top:0; }
  aside.flt .grp { padding:12px 14px; border-bottom:1px solid var(--line2); } aside.flt .grp:last-child { border:0; }
  aside.flt h4 { margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  aside.flt label { display:flex; gap:8px; align-items:center; padding:3px 0; cursor:pointer; font-size:13.5px; } aside.flt label .c { margin-left:auto; color:var(--faint); font-size:12px; }
  aside.flt .reset { padding:10px 14px; font-size:12.5px; }
  .dd { position:relative; } .dd-btn { width:100%; display:flex; justify-content:space-between; gap:6px; text-align:left; background:#fff; color:var(--text); border:1px solid #c9d0dc; border-radius:4px; padding:7px 9px; font-weight:400; font-size:13px; }
  .dd-list { position:absolute; left:0; right:0; top:100%; z-index:5; border:1px solid #c9d0dc; border-radius:0 0 4px 4px; background:#fff; box-shadow:0 8px 20px rgba(0,0,0,.12); max-height:340px; overflow:auto; }
  .dd-list a { display:block; padding:7px 10px; color:var(--text); font-size:13px; text-decoration:none; } .dd-list a:hover { background:var(--blue-l); } .dd-list a.on { font-weight:700; color:var(--blue); }
  .rbar { display:flex; align-items:center; gap:12px; margin-bottom:12px; }

    <div id="launcher"></div>
    <div id="site">
      <div class="util"><span id="u-left">Salvage &middot; Insurance &middot; Repo &middot; Collector</span><span class="sp"></span><span id="u-clock"></span><span id="u-yard"></span><span id="units"></span><span id="weblink"></span></div>

        <div class="logo" onclick="go('home')"><div class="mark"></div><div class="wm">Bean<span>Auctions</span></div></div>
        <div class="search"><input id="q" placeholder="Search by make, model, year or lot number"><button class="btn-y" onclick="search()">Search</button></div>
        <div class="acct">Available balance<b id="money" class="num">$0</b></div>
      </header>
      <nav id="nav"></nav>
      <div id="conn"></div>
      <main id="main"></main>

<script>
// Runs inside the game (iframe over the game UI, talks through bngApi) or in a normal browser
// (websocket to the game's web server, see startWeb in beanAuctions.lua).
const inGame = window.parent !== window && !!parent.bngApi;
const webKey = new URLSearchParams(location.search).get('key');
let ws = null;
function setConn(msg) { const c = document.getElementById('conn'); c.textContent = msg || ''; c.style.display = msg ? 'block' : 'none'; }
function connect() {
  ws = new WebSocket(`ws://${location.host}/`, 'beanauctions');
  ws.onopen = () => { setConn(); act('refresh'); };
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if (!d.badKey) return baState(d);
    ws.onclose = null; ws.close();
    setConn('This link is missing its access key. Copy the link again from the auction site in the game.');
  };
  ws.onclose = () => { setConn('Not connected to BeamNG. Load a career save and this page reconnects by itself.'); setTimeout(connect, 2000); };
}

// ---------- state ----------
let S = { lots: [], money: 0, garage: [], venues: { salvageFee: [100, 0.08], collectorFee: [0, 0.1] } }, gotAt = Date.now();
let view = (location.hash || '').slice(1) || (inGame ? 'launcher' : 'home');
if (!inGame && view === 'launcher') view = 'home';
let lotId = null, drafts = {}, scanVeh = null, sortOpen = false, page = 0, liveFocus = null, myTab = 'active', heroQ = '';
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
let unitPref = store('baUnits');
let layout = store('baLayout') || 'grid';
let watch = new Set(JSON.parse(store('baWatch') || '[]'));
const hist = {}; // lotId -> [{who, price, t}] newest first, built from what this page has seen
let prev = {};   // lotId -> {state, winning} from the last update, for notifications
const openedAt = Date.now();
let wallpaper = null;

const sellers = [
  ['Insurance', '#1d4ea8', 'Late-model write-offs on a salvage title. Low miles, real damage.'],
  ['Repo', '#1e7b3a', 'Clean-title repossessions that run and drive. Small issues at most.'],
  ['Salvage Pool', '#c2410c', 'High-mileage wrecks and parts cars. Bring a trailer.'],
  ['Dealer Trade-In', '#6d28d9', 'Lot rejects and high-mile runners. Some run rough.'],
];
const filters = { salvage: true, clean: true, rd: false, lowMiles: false, liveOnly: false, under5k: false, sellers: {}, sort: 'ending' };

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const money = n => '$' + Math.round(n || 0).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const elapsed = () => Math.floor((Date.now() - gotAt) / 1000 * (S.speed || 1));
const left = l => Math.max(0, l.timeLeft - elapsed());
const clock = s => s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m` : s >= 60 ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s` : `${s}s`;
const useMi = () => (unitPref || (S.units === 'imperial' ? 'mi' : 'km')) === 'mi';

function act(action, id = 0, amount = 0, arg = '') {
  if (inGame) parent.bngApi.engineLua(`career_modules_beanAuctions.uiAction(${JSON.stringify(action)}, ${+id}, ${+amount}, ${JSON.stringify(String(arg))})`);
  else if (ws && ws.readyState === 1) ws.send(JSON.stringify({ key: webKey, action, id: +id, amount: +amount, arg: String(arg) }));
}
function bid(id) {
  const v = parseInt(String(drafts[id] ?? '').replace(/[^0-9]/g, ''));
  if (!v) return note('Enter your max bid first', 'err');
  act('bid', id, v);
}
function bump(id, add) {
  const l = S.lots.find(x => x.id === id); if (!l) return;
  const cur = parseInt(String(drafts[id] ?? '').replace(/[^0-9]/g, '')) || 0;
  drafts[id] = String(add ? Math.max(cur, l.nextBid) + add : l.nextBid);
  render();
}
function toggleWatch(id, ev) {
  if (ev) ev.stopPropagation();
  watch.has(id) ? watch.delete(id) : watch.add(id);
  store('baWatch', JSON.stringify([...watch]));
  render();
}
const starBtn = l => `<a class="star ${watch.has(l.id) ? 'on' : ''}" title="${watch.has(l.id) ? 'Remove from watchlist' : 'Add to watchlist'}" onclick="toggleWatch(${l.id}, event)">${icon('star')}</a>`;

function note(msg, kind = 'ok', head) {
  const diag = view === 'scan' && !head; // notifications come from whichever app is open
  const n = document.createElement('div');
  n.className = 'note ' + kind;
  n.innerHTML = `<div class="ni" style="${diag ? 'background:#2b2f36' : ''}"><svg viewBox="0 0 24 24" style="${diag ? 'stroke:#7dff9a' : ''}">${diag ? I.obd : I.gavel}</svg></div><div><small>${esc(head || (diag ? 'Bean Diag' : 'BeanAuctions'))}</small>${esc(msg)}</div>`;
  $('#notes').prepend(n);
  while ($('#notes').children.length > 3) $('#notes').lastChild.remove();
  setTimeout(() => n.remove(), 3800);
}

window.baState = data => {
  // Lua's jsonEncode sends empty tables as {} not [], so coerce every list back to an array
  const arr = x => Array.isArray(x) ? x : [];
  data.lots = arr(data.lots); data.lots.forEach(l => l.known = arr(l.known));
  data.garage = arr(data.garage);
  data.venues = data.venues || S.venues;
  if (data.scan) { data.scan.vehicles = arr(data.scan.vehicles); data.scan.vehicles.forEach(v => { if (v.faults) v.faults = arr(v.faults); v.refurb = arr(v.refurb); }); }
  const first = !S.lots.length;
  for (const l of data.lots) {
    // bid history from the updates this page sees
    const h = hist[l.id] = hist[l.id] || [];
    if (l.leader && (!h[0] || h[0].price !== l.price || h[0].who !== l.leader)) h.unshift({ who: l.leader, price: l.price, t: Date.now() });
    if (h.length > 40) h.length = 40;
    const p = prev[l.id];
    if (!first && p) {
      const name = `${l.year} ${l.name}`;
      if (p.state === 'prebid' && l.state === 'live' && (watch.has(l.id) || l.myMax != null || l.consigned)) note(`Lot #${l.id} ${name} is live now`, 'info', 'Live auction');
      if (p.winning && !l.winning && l.myMax != null && open(l)) note(`You were outbid on the ${name}`, 'err', 'Outbid');
    }
  }
  prev = Object.fromEntries(data.lots.map(l => [l.id, { state: l.state, winning: l.winning }]));
  if (!wallpaper) {
    const best = data.lots.filter(l => l.preview && open(l)).sort((a, b) => b.retail - a.retail)[0];
    if (best) wallpaper = best.preview;
  }
  S = data; gotAt = Date.now(); loaded = true;
  if (data.message) note(data.message, data.isError ? 'err' : 'ok');
  render();
};

function go(v) { view = v; lotId = null; sortOpen = false; if (v === 'find') page = 0; render(); $('#main').scrollTop = 0; }

function preset(p) {
  Object.assign(filters, { salvage: true, clean: true, rd: false, lowMiles: false, liveOnly: false, under5k: false, sellers: {} });
  if (p === 'rd') filters.rd = true;
  if (p === 'low') filters.lowMiles = true;
  if (p === 'clean') filters.salvage = false;
  if (p === 'salvage') filters.clean = false;
  if (p === 'live') filters.liveOnly = true;
  if (p === 'cheap') filters.under5k = true;
  if (p && p.startsWith('seller:')) { const keep = p.slice(7); sellers.forEach(([s]) => filters.sellers[s] = s !== keep); }

  go('find');
}

function when(l) {
  if (isLive(l)) return `<span class="chip-live"><i></i>LIVE NOW</span>`;
  if (l.state === 'prebid') return `<span class="when num">${icon('clock')} ${clock(left(l))}</span>`;
  if (l.state === 'won') return `<span class="tag t-mine">YOU WON</span>`;
  if (l.state === 'sold') return `<span class="when">Sold</span>`;
  if (l.state === 'noSale') return `<span class="when">No sale</span>`;
  if (l.state === 'collected') return `<span class="when">Collected</span>`;
  return `<span class="when">Preparing</span>`;
}
function statusText(l) {
  if (isLive(l)) return `<span class="chip-live"><i></i>LIVE</span>`;
  if (l.state === 'prebid') return `<span class="muted">Live in</span> <b class="num">${clock(left(l))}</b>`;
  if (l.state === 'won') return `<span class="tag t-mine">YOU WON</span>`;
  if (l.state === 'sold') return `<span class="muted">Sold${l.leader ? ' to ' + esc(l.leader) : ''}</span>`;
  if (l.state === 'collected') return `<span class="muted">Collected</span>`;
  if (l.state === 'noSale') return `<span class="muted">No sale</span>`;
  return `<span class="muted">Preparing vehicle...</span>`;
}
function tags(l) {
  return `<span class="tag ${l.title === 'Salvage' ? 't-salvage' : 't-clean'}">${esc(l.title).toUpperCase()}</span>`
    + (l.runsAndDrives ? `<span class="tag t-rd">RUN &amp; DRIVE</span>` : '')
    + (lowMiles(l) ? `<span class="tag t-low">LOW MILES</span>` : '')
    + (l.inspected ? `<span class="tag t-insp">INSPECTED</span>` : '')

function findView() {
  const q = ($('#q').value || '').trim().toLowerCase();
  const base = S.lots.filter(open);
  let rows = base.filter(l =>
    (filters.salvage || l.title !== 'Salvage') && (filters.clean || l.title !== 'Clean') && (!filters.rd || l.runsAndDrives) && (!filters.lowMiles || lowMiles(l))
    && (!filters.liveOnly || isLive(l)) && (!filters.under5k || l.price < 5000) && !filters.sellers[l.seller]
    && (!q || `${l.year} ${l.name} ${l.id} ${l.seller}`.toLowerCase().includes(q)));
  rows.sort((sorts.find(x => x[0] === filters.sort) || sorts[0])[2]);
  const per = layout === 'grid' ? 24 : 20, pages = Math.max(1, Math.ceil(rows.length / per));
  page = Math.min(page, pages - 1);
  const shown = rows.slice(page * per, page * per + per);
  const chk = (k, t, n) => `<label><input type="checkbox" ${filters[k] ? 'checked' : ''} onchange="setF('${k}',this.checked)">${t}${n != null ? `<span class="c">${n}</span>` : ''}</label>`;
  const chip = (k, t) => `<span class="chip ${filters[k] ? 'on' : ''}" onclick="setF('${k}',${!filters[k]})">${t}</span>`;
  const sortLabel = (sorts.find(x => x[0] === filters.sort) || sorts[0])[1];

}

function bidPanel(l) {

        ${l.myMax != null ? `<div class="mystat ${l.winning ? 'w' : 'l'}">${l.winning ? 'You are the high bidder' : 'You have been outbid'} &middot; your max ${money(l.myMax)}</div>` : ''}

// what the auctioneer is calling, from how long the lot has gone without a bid
function chant(l) {
  const idle = idleOf(l);
  if (!l.leader) return `Who'll open at ${money(l.startBid)}?`;
  if (idle >= 6) return `Going twice at ${money(l.price)}... last call`;
  if (idle >= 3) return `Going once at ${money(l.price)}...`;
  return `${money(l.price)}, do I hear ${money(l.nextBid)}?`;
}
const seenPrice = {};
function flashed(l) { const hit = seenPrice[l.id] != null && seenPrice[l.id] !== l.price; seenPrice[l.id] = l.price; return hit; }
function liveView() {

    <div class="venues">
      <div class="venue"><div class="kick" style="color:var(--blue)">Any car, any condition</div><h4>Salvage sale</h4><div class="muted">Fast and simple. Salvage buyers bid low to fair.</div>
        <ul><li>Live in about 2 minutes</li><li>No entry fee</li><li>Seller fee: ${pct(S.venues.salvageFee)} of the hammer price</li></ul></div>
      <div class="venue col"><div class="kick">The big stage</div><h4>Collector Auction</h4><div class="muted">Collectors, museums and exotic dealers. Bids regularly clear book value; restored classics do best.</div>
        <ul><li>Cars worth $25,000+ or 25+ years old, fully repaired</li><li>Entry fee: $500 + 1% of value (not refunded)</li><li>Seller fee: ${pct(S.venues.collectorFee)} of the hammer price</li></ul></div>
    </div>
    ${own.length ? `<h2 class="sec">Your consignments</h2><div class="card" style="overflow:hidden"><table class="tb"><tr><th></th><th>Vehicle</th><th>Status</th><th>High bid</th><th>You get</th><th></th></tr>
      ${own.map(l => `<tr class="click" onclick="openLot(${l.id})"><td style="width:132px">${photo(l.preview, 'th')}</td><td><a style="font-weight:700">${title(l)}</a><div class="muted">Lot #${l.id} &middot; ${l.venue === 'collector' ? 'Collector Auction' : 'Salvage sale'}</div></td>
        <td>${statusText(l)}${l.reserve ? `<div class="muted">Reserve ${money(l.reserve)} ${reserveMet(l) ? '(met)' : '(not met)'}</div>` : ''}</td>
        <td class="num"><b>${money(l.price)}</b><div class="muted">${esc(l.leader || 'no bids yet')}</div></td><td class="num"><b>${l.state === 'noSale' ? '-' : money(l.payout)}</b></td>
        <td>${l.state === 'prebid' ? `<button class="btn-o" onclick="event.stopPropagation();act('goLive',${l.id})">Start now</button>` : ''}</td></tr>`).join('')}</table></div>` : ''}
    <h2 class="sec">Your garage <span class="muted">Value follows the parts on the car. Fresh parts count; restored classics earn up to 2x their price new.</span></h2>
    ${S.garage.length ? `<div class="card" style="overflow:hidden"><table class="tb"><tr><th></th><th>Vehicle</th><th>Condition</th><th>Value</th><th>Reserve</th><th>List it</th></tr>
      ${S.garage.map(v => `<tr><td style="width:132px">${v.thumbnail ? photo(v.thumbnail, 'th') : ''}</td>
        <td><b>${v.year ? v.year + ' ' : ''}${esc(v.name)}</b><div class="muted num">${odo(v.km)} on the body</div>${v.condition && v.condition.restoredClassic ? '<span class="tag t-clean">RESTORED CLASSIC</span>' : v.classic ? '<span class="tag t-low">CLASSIC</span>' : ''}</td>
        <td>${v.condition ? `<span class="meter"><i style="width:${Math.round(v.condition.score * 100)}%;background:${v.condition.score > .8 ? 'var(--green)' : v.condition.score > .5 ? 'var(--yellow-d)' : 'var(--red)'}"></i></span><b class="num">${Math.round(v.condition.score * 100)}</b><span class="muted">/100</span><div class="muted num">parts average ${odo(v.condition.km)}</div>` : '<span class="muted">-</span>'}</td>
        <td class="num"><b style="font-size:15px">${money(v.value)}</b>${v.value < v.clean ? `<div class="muted">${money(v.clean)} once repaired</div>` : ''}</td>
        <td>${v.reason ? '' : `<input id="max-res-${v.id}" class="num" style="width:130px" placeholder="No reserve" value="${draft(v.id)}" oninput="drafts['res${v.id}']=this.value">`}</td>
        <td>${v.reason ? `<span class="muted">${esc(v.reason)}</span>${v.lotId ? ` &middot; <a onclick="openLot(${v.lotId})">Lot #${v.lotId}</a>` : ''}` :
          `<button class="btn-o" onclick="consign(${v.id},'salvage')">Salvage sale</button>
           <button class="btn-b" ${v.collectorReason ? 'disabled' : ''} title="${esc(v.collectorReason || '')}" onclick="consign(${v.id},'collector')">Collector Auction &middot; ${money(v.entryFee)}</button>
           ${v.collectorReason ? `<div class="muted" style="margin-top:4px">${esc(v.collectorReason)}</div>` : ''}`}</td></tr>`).join('')}</table></div>`
      : `<div class="empty"><b>Your garage is empty</b>Win something first, then come back to flip it.</div>`}${foot()}</div>`;
}
function consign(id, venue) {
  const r = parseInt(String(drafts['res' + id] ?? '').replace(/[^0-9]/g, '')) || 0;
  delete drafts['res' + id];
  act('consign', id, r, venue);
}

// ---------- Bean Diag: the scan tool as its own app ----------
const modules = [['engine', 'Engine control (ECM)'], ['trans', 'Transmission (TCM)'], ['cool', 'Cooling system'], ['turbo', 'Forced induction'], ['body', 'Body control (BCM)'], ['chassis', 'ABS / chassis']];
const modOf = f => { const c = (f.codes[0] || [''])[0]; return c[0] === 'B' ? 'body' : /^P07/.test(c) ? 'trans' : c === 'P0299' ? 'turbo' : c === 'P0217' || c === 'P2560' ? 'cool' : 'engine'; };
let diagTab = 'diag';
const scanStart = {}, scanTime = 3200; // the sweep runs at least this long so a scan feels like a scan
const sweeping = v => v.scanning || Date.now() - (scanStart[v.id] || 0) < scanTime;
function startScan(id) { scanStart[id] = Date.now(); act('scan', id); render(); }
function diagView() {
  const vs = (S.scan && S.scan.vehicles) || [];
  if (!vs.find(v => v.id === scanVeh)) scanVeh = vs[0] ? vs[0].id : null;
  const v = vs.find(x => x.id === scanVeh);
  const bar = `<div class="dg-bar"><div class="dg-ico"><svg viewBox="0 0 24 24">${I.obd}</svg></div><div class="dg-title"><b>BEAN DIAG PRO</b><span>OBD-II diagnostics &middot; shop labor ${money(S.scan ? S.scan.laborRate : 0)}/hr</span></div><span class="sp"></span>
    ${v ? `<span class="pill ${v.inRange ? 'ok' : ''}"><i></i>${v.inRange ? 'Connected: ' + esc(v.name) : 'Not connected'}</span>` : ''}${inGame ? '' : `<a onclick="go('home')">&larr; Back to BeanAuctions</a>`}</div>`;
  if (!v) return bar + `<div class="dg-empty full"><div class="ring"><svg viewBox="0 0 24 24">${I.obd}</svg></div><b>No vehicles to scan</b>Buy or win a car first, then come back and plug in.<button class="btn-y" style="margin-top:18px" onclick="go('home')">Browse the auctions</button></div>`;
  const side = `<div class="dg-side"><div class="dg-h">Your vehicles</div>${vs.map(x => `<div class="dv ${x.id === scanVeh ? 'on' : ''}" onclick="scanVeh=${x.id};render()">${photo(x.thumbnail)}<div><b>${x.year ? x.year + ' ' : ''}${esc(x.name)}</b><small><i class="${x.inRange ? 'g' : ''}"></i>${x.inRange ? 'In range' : 'Out of range'}${x.faults ? ' &middot; ' + x.faults.length + ' DTC' : ''}</small></div></div>`).join('')}</div>`;
  const fs = v.faults, total = fs ? fs.reduce((a, f) => a + f.total, 0) : 0;
  const busy = sweeping(v);
  const head = `<div class="dg-head">${photo(v.thumbnail)}<div><h2>${v.year ? v.year + ' ' : ''}${esc(v.name)}</h2><div class="sub">${v.inRange ? 'Plugged in and ready.' : esc(v.reason || 'Walk within 15 m of this vehicle to connect.')}</div></div><span class="sp"></span>
    <button class="scanbtn" ${v.inRange && !busy ? '' : 'disabled'} onclick="startScan(${v.id})">${busy ? 'SCANNING...' : fs ? 'SCAN AGAIN' : 'SCAN'}</button></div>`;
  const tabs = `<div class="dg-tabs"><a class="${diagTab === 'diag' ? 'on' : ''}" onclick="diagTab='diag';render()">Diagnostics${fs && fs.length ? ` <span class="cnt red">${fs.length}</span>` : ''}</a><a class="${diagTab === 'refurb' ? 'on' : ''}" onclick="diagTab='refurb';render()">Refurbish</a></div>`;
  if (diagTab === 'refurb') return bar + `<div class="dg-body">${side}<div class="dg-main">${head.replace('class="scanbtn"', 'class="scanbtn" style="display:none"')}${tabs}${refurbView(v)}</div></div>`;
  let body;
  if (busy) {
    const t = Date.now() - (scanStart[v.id] || Date.now()), step = scanTime / (modules.length + 1);
    const done = Math.min(modules.length, Math.floor(t / step));
    const log = ['LINK OK  ISO 15765-4 CAN 500K', 'READING VIN... OK', ...modules.slice(0, done + 1).map(m => `QUERY ${m[1].toUpperCase()}`)];
    body = `<div class="dg-grid"><div class="panel"><div class="dg-h">Modules</div>${modules.map(([, name], i) => `<div class="mod"><span>${name}</span>${i < done ? '<span class="st ok">Read</span>' : i === done ? '<span class="st run"><span class="spin"></span>Reading</span>' : '<span class="st wait">Waiting</span>'}</div>`).join('')}<div class="prog"><i style="width:${Math.round(done / modules.length * 100)}%"></i></div></div>
      <div class="term">${log.map(x => `<div>&gt; ${x}</div>`).join('')}<div>&gt; <span class="cur"></span></div></div></div>`;
  } else if (!v.inRange && !fs) body = `<div class="panel"><div class="dg-empty">${photo(v.thumbnail)}<b>No vehicle connected</b>${esc(v.reason || 'Walk within 15 m of the vehicle you want to scan.')}</div></div>`;
  else if (!fs) body = `<div class="dg-grid"><div class="panel"><div class="dg-h">Modules</div>${modules.map(([, name]) => `<div class="mod"><span>${name}</span><span class="st wait">Not read</span></div>`).join('')}</div>
      <div class="term"><div>&gt; VEHICLE CONNECTED</div><div>&gt; PRESS SCAN TO READ TROUBLE CODES</div><div>&gt; <span class="cur"></span></div></div></div>`;
  else {
    const count = sev => fs.filter(f => f.severity === sev).length;
    const byMod = k => fs.filter(f => modOf(f) === k).length;
    body = `<div class="sum"><div><b class="num">${fs.length}</b><span>Faults</span></div><div><b class="num" style="color:#ff7b72">${count('Critical')}</b><span>Critical</span></div><div><b class="num" style="color:#ffd166">${count('Moderate')}</b><span>Moderate</span></div><div><b class="num">${money(total)}</b><span>Est. repair</span></div>
        <div class="act">${fs.length ? `<button class="btn-y btn-lg" ${v.inRange ? '' : 'disabled'} onclick="act('repair',${v.id})">Repair all</button>` : ''}</div></div>
      <div class="dg-grid"><div class="panel"><div class="dg-h">Modules</div>${modules.map(([k, name]) => `<div class="mod"><span>${name}</span>${byMod(k) ? `<span class="st bad">${byMod(k)} fault${byMod(k) > 1 ? 's' : ''}</span>` : '<span class="st ok">Pass</span>'}</div>`).join('')}</div>
      <div>${fs.length ? fs.map((f, i) => `<div class="fault sev-${f.severity}" style="animation-delay:${i * 70}ms"><div>
          <div class="codes">${f.codes.map(c => `<code>${esc(c[0])}</code>`).join('')}<span class="sevb">${f.severity.toUpperCase()}</span></div>
          <div class="desc">${f.codes.map(c => esc(c[1])).join(' &middot; ')}</div>
          <div class="part">${esc(f.part)}</div><div class="fix">${esc(f.fix)}</div></div>
        <div class="cost"><b class="num">${money(f.total)}</b><small>parts ${money(f.parts)} + ${f.hours}h labor ${money(f.labor)}</small><button class="ghost" ${v.inRange ? '' : 'disabled'} onclick="act('repair',${v.id},0,${esc(JSON.stringify(f.path))})">Repair</button></div></div>`).join('')
        : `<div class="panel allgood"><div class="ck"><svg class="i" viewBox="0 0 24 24">${I.check}</svg></div><b>No trouble codes</b><span>Every module passes. This one is healthy.</span></div>`}</div></div>`;
  }
  return bar + `<div class="dg-body">${side}<div class="dg-main">${head}${tabs}${body}</div></div>`;
}
function refurbView(v) {
  const cap = (S.scan && S.scan.refurbishMax) || 0.95, pct = x => Math.round(x * 100);
  const rf = v.refurb || [], todo = rf.filter(p => p.worn), total = todo.reduce((a, p) => a + p.cost, 0);
  const meter = sc => `<div class="rf-bar"><i style="width:${pct(sc)}%;background:${sc >= cap - 0.005 ? '#4ade80' : sc > 0.6 ? '#ffd166' : '#ff7b72'}"></i><b style="left:${pct(cap)}%"></b></div>`;
  return `<div class="rf-top"><div><div class="dg-h" style="margin:0">Overall condition</div><div class="rf-big num">${v.condition ? pct(v.condition.score) : '-'}<span>/100</span></div></div>
      <p>Rebuild a whole system with refurbished parts. Refurbish all five for a full restoration. Refurbished parts come back to <b>${pct(cap)}%</b> at most; only a brand-new part from the parts shop is 100%.</p>
      <button class="btn-y btn-lg" ${todo.length && v.inRange ? '' : 'disabled'} onclick="act('refurbish',${v.id},0,'')">Refurbish everything${todo.length ? ' &middot; ' + money(total) : ''}</button></div>
    ${!v.inRange ? `<div class="pill" style="margin-bottom:12px;display:inline-flex"><i></i>${esc(v.reason || 'Get to the vehicle to work on it.')}</div>` : ''}
    <div class="rf-grid">${rf.map(p => `<div class="panel rf">
        <div class="rf-h"><b>${esc(p.name)}</b><span class="num">${pct(p.score)}%</span></div>${meter(p.score)}
        <div class="rf-sub">${p.worn ? `${p.worn} worn part${p.worn > 1 ? 's' : ''} &middot; ${p.hours}h labor` : 'At or above refurbished condition'}</div>
        <div class="rf-f"><span class="num">${p.worn ? money(p.cost) : ''}</span><button class="ghost" ${p.worn && v.inRange ? '' : 'disabled'} onclick="act('refurbish',${v.id},0,'${p.id}')">${p.worn ? 'Refurbish' : 'Done'}</button></div>
      </div>`).join('') || '<div class="panel dg-empty"><b>No mechanical parts found</b></div>'}</div>`;
}

// ---------- chrome + render ----------
function chrome() {
  const live = S.lots.filter(isLive).length, wonN = S.lots.filter(l => l.state === 'won').length, ownN = S.lots.filter(l => l.consigned && open(l)).length;
  const tab = (k, t, extra = '') => `<a class="${view === k || (view === 'lot' && k === 'find') ? 'on' : ''}" onclick="go('${k}')">${t}${extra}</a>`;
  patch($('#nav'), tab('home', 'Home') + tab('find', 'Find vehicles', ` <span class="cnt">${S.lots.filter(open).length}</span>`)
    + tab('live', `${live ? '<span class="livedot"></span>' : ''}Live auctions`, live ? ` <span class="cnt red">${live}</span>` : '')
    + tab('mine', 'My bids', wonN ? ` <span class="cnt y">${wonN} won</span>` : '') + tab('sell', 'Sell my car', ownN ? ` <span class="cnt">${ownN}</span>` : '')
    + `<span class="sp"></span>${S.travelPrice != null ? `<span class="meta">${icon('pin')}&nbsp;Fast travel to yard: ${S.travelPrice ? money(S.travelPrice) : 'free'}</span>` : ''}`);
  $('#money').textContent = money(S.money);
  $('#u-clock').innerHTML = S.speed > 1 ? '<span class="clk2">AUCTION CLOCK 2x</span>' : '';
  $('#units').innerHTML = `Units: ${['km', 'mi'].map(u => `<a class="unit ${(useMi() ? 'mi' : 'km') === u ? 'on' : ''}" onclick="setUnits('${u}')">${u}</a>`).join(' / ')}`;
  $('#u-left').innerHTML = inGame ? 'Salvage &middot; Insurance &middot; Repo &middot; Collector' : `<a onclick="go('scan')">Open Bean Diag (scan tool)</a>`;
  $('#weblink').innerHTML = inGame && S.webUrl ? `<a onclick="act('openBrowser')">Copy link for your browser &#8599;</a>` : '';
  $('.logo .mark').innerHTML = `<svg viewBox="0 0 24 24">${I.gavel}</svg>`;
  // tablet status bar
  $('#sb-time').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const batt = Math.max(9, 100 - Math.floor((Date.now() - openedAt) / 90000));
  $('#sb-batt').textContent = batt + '%'; $('#sb-batti').style.setProperty('--b', Math.round(batt / 100 * 17) + 'px');
  $('#sb-net').innerHTML = icon('wifi');
  $('#power').innerHTML = icon('power');
}

// Patch the DOM in place instead of replacing it, so hover states, images, inputs and running
// animations survive the once-a-second refresh.
function morph(from, to) {
  const a = [...from.childNodes], b = [...to.childNodes];
  b.forEach((y, i) => {
    const x = a[i];
    if (!x) return from.appendChild(y);
    if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName) return from.replaceChild(y, x);
    if (x.nodeType === 3) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; return; }
    if (x.nodeType !== 1) return;
    for (const at of [...x.attributes]) if (!y.hasAttribute(at.name)) x.removeAttribute(at.name);
    for (const at of [...y.attributes]) if (x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value);
    if (x.tagName === 'INPUT') {
      if (x.type === 'checkbox') x.checked = y.hasAttribute('checked');
      else if (x !== document.activeElement && x.value !== (y.getAttribute('value') || '')) x.value = y.getAttribute('value') || '';
      return;
    }
    morph(x, y);
  });
  for (let i = a.length - 1; i >= b.length; i--) from.removeChild(a[i]);
}
function patch(el, html) { const t = document.createElement(el.tagName); t.innerHTML = html; morph(el, t); }

let loaded = false, lastGroup = null;
function render() {
  const group = view === 'launcher' && inGame ? 'launcher' : view === 'scan' ? 'diag' : 'site';
  document.body.classList.toggle('on-launcher', group === 'launcher');
  document.body.classList.toggle('on-diag', group === 'diag');
  if (group !== lastGroup) {
    const el = $('#' + group);
    el.classList.remove('appin', 'homein'); void el.offsetWidth;
    if (lastGroup) el.classList.add(group === 'launcher' ? 'homein' : 'appin');
    lastGroup = group;
  }
  chrome();
  if (group === 'launcher') return patch($('#launcher'), launcherView());
  if (group === 'diag') return patch($('#diag'), diagView());
  if (!loaded) return patch($('#main'), `<div class="wrap"><div class="empty"><b>Connecting to the auction...</b>Loading today's lots.</div></div>`);
  patch($('#main'), view === 'lot' ? lotView() : view === 'live' ? liveView() : view === 'mine' ? mineView() : view === 'sell' ? sellView() : view === 'find' ? findView() : homeView());
}
function closeTablet() {
  if (document.body.classList.contains('closing')) return;
  document.body.classList.add('closing');
  setTimeout(() => act('close'), 190);
}

document.body.classList.toggle('ingame', inGame);
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
$('#q').addEventListener('input', () => { if (view === 'find') { page = 0; render(); } });
// in game, Esc is a key binding (beanAuctions_back) so it works before the page has focus; this covers
// typing in a text box, when the game's own bindings are off. closeTablet ignores a second call.
document.addEventListener('keydown', e => { if (inGame && e.key === 'Escape') closeTablet(); });
document.addEventListener('click', e => { if (sortOpen && !e.target.closest('.dd')) { sortOpen = false; render(); } });
// the game only sends keystrokes to the page while CEF typing is on (stock UI does the same on input focus)
const isText = el => el && el.tagName === 'INPUT' && el.type !== 'checkbox';
document.addEventListener('focusin', e => inGame && isText(e.target) && parent.bngApi.engineLua('setCEFTyping(true)'));
document.addEventListener('focusout', e => inGame && isText(e.target) && parent.bngApi.engineLua('setCEFTyping(false)'));
setInterval(() => { if (document.activeElement !== $('#q')) render(); }, 1000); // local countdowns between Lua pushes
setInterval(() => { if (view === 'scan' && Object.values(scanStart).some(t => Date.now() - t < scanTime + 300)) render(); }, 150); // smooth scan sweep
render();
if (inGame) act('refresh'); else connect();
</script>
</body>
